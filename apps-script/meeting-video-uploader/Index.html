<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting Logger</title>
    <style>
      :root {
        font-family: Inter, Arial, sans-serif;
        color: #0f172a;
      }

      body {
        margin: 0;
        padding: 24px;
        background: #f8fafc;
      }

      .card {
        max-width: 640px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 8px;
      }

      .hint {
        margin-top: 0;
        color: #475569;
        font-size: 14px;
      }

      label {
        display: block;
        margin-top: 14px;
        margin-bottom: 6px;
        font-weight: 600;
      }

      input,
      textarea,
      button {
        width: 100%;
        box-sizing: border-box;
        font-size: 14px;
      }

      input,
      textarea {
        padding: 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
      }

      textarea {
        resize: vertical;
      }

      button {
        margin-top: 16px;
        padding: 11px 14px;
        border: 0;
        border-radius: 8px;
        background: #2563eb;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
      }

      button[disabled] {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .status {
        margin-top: 14px;
        font-size: 14px;
        color: #1e293b;
      }

      .status.error {
        color: #b91c1c;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Meeting Logger</h1>
      <p class="hint">
        Upload your video to Google Drive first, then paste the file link here.
      </p>

      <form id="uploadForm">
        <label for="meetingTitle">Meeting title</label>
        <input id="meetingTitle" type="text" placeholder="Weekly sync" />

        <label for="participants">Participants</label>
        <input id="participants" type="text" placeholder="Alex, Jamie, Sam" />

        <label for="notes">Notes</label>
        <textarea id="notes" rows="3" placeholder="Optional notes"></textarea>

        <label for="driveUrl">Google Drive video URL</label>
        <input
          id="driveUrl"
          type="url"
          placeholder="https://drive.google.com/file/d/..."
          required
        />

        <button id="submitBtn" type="submit">Log to Google Sheet</button>
      </form>

      <p id="status" class="status"></p>
    </main>

    <script>
      const form = document.getElementById('uploadForm');
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        setStatus('Logging...');

        const driveUrl = document.getElementById('driveUrl').value.trim();

        if (!driveUrl) {
          setStatus('Please paste a Google Drive file URL.', true);
          return;
        }

        submitBtn.disabled = true;

        const payload = {
          meetingTitle: document.getElementById('meetingTitle').value.trim(),
          participants: document.getElementById('participants').value.trim(),
          notes: document.getElementById('notes').value.trim(),
          driveUrl
        };

        google.script.run
          .withSuccessHandler((result) => {
            const fileLabel = result.fileName && result.fileName !== 'Unknown'
              ? result.fileName
              : 'Meeting logged';
            setStatus(`Done. Logged: ${fileLabel}`);
            form.reset();
            submitBtn.disabled = false;
          })
          .withFailureHandler((error) => {
            setStatus(error.message || 'Logging failed.', true);
            submitBtn.disabled = false;
          })
          .logMeeting(payload);
      });

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.classList.toggle('error', isError);
      }
    </script>
  </body>
</html>
