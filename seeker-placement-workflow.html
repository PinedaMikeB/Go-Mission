<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Mission | Seeker Placement Workflow</title>
    <meta
        name="description"
        content="Minimal animated workflow page for Go Mission seeker placement."
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap"
        rel="stylesheet"
    >
    <style>
        :root {
            --bg: #f7efe2;
            --bg-soft: #fff8ef;
            --ink: #321911;
            --muted: #7a5b50;
            --line: rgba(86, 44, 25, 0.12);
            --wine: #6f1d1b;
            --burnt: #c75a31;
            --gold: #efb150;
            --seeker: #d57441;
            --admin: #7f2f28;
            --management: #36718a;
            --group: #46795f;
            --card: rgba(255, 251, 245, 0.88);
            --shadow: 0 26px 70px rgba(88, 45, 24, 0.12);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --transition: 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Manrope", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(circle at top left, rgba(239, 177, 80, 0.28), transparent 24%),
                radial-gradient(circle at right 20%, rgba(111, 29, 27, 0.12), transparent 20%),
                linear-gradient(180deg, #fff8ef 0%, #f7efe2 52%, #f3e5d6 100%);
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.14;
            background-image:
                linear-gradient(rgba(111, 29, 27, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(111, 29, 27, 0.04) 1px, transparent 1px);
            background-size: 30px 30px;
            mask-image: radial-gradient(circle at center, black, transparent 78%);
        }

        h1, h2, p {
            margin: 0;
        }

        button {
            font: inherit;
            border: 0;
            background: none;
            cursor: pointer;
        }

        .page {
            width: min(calc(100% - 24px), 1240px);
            margin: 0 auto;
            padding: 18px 0 42px;
        }

        .panel {
            border: 1px solid var(--line);
            border-radius: var(--radius-xl);
            background: linear-gradient(180deg, rgba(255, 252, 247, 0.86), rgba(255, 249, 241, 0.72));
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 28px;
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 260px;
            height: 260px;
            right: -80px;
            top: -110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(239, 177, 80, 0.35), transparent 70%);
        }

        .hero-grid {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.15fr) minmax(260px, 0.85fr);
            gap: 20px;
            align-items: center;
        }

        .eyebrow,
        .stage-number,
        .role-pill,
        .mini-label {
            font-family: "Bebas Neue", sans-serif;
            letter-spacing: 0.12em;
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            background: rgba(111, 29, 27, 0.08);
            color: var(--wine);
            font-size: 0.95rem;
        }

        .eyebrow::before {
            content: "";
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--burnt), var(--gold));
        }

        .hero h1 {
            margin-top: 14px;
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(3.4rem, 7vw, 6.2rem);
            line-height: 0.9;
            letter-spacing: 0.04em;
            max-width: 9ch;
        }

        .hero p {
            margin-top: 14px;
            max-width: 48ch;
            color: var(--muted);
            line-height: 1.6;
            font-size: 1rem;
        }

        .hero-actions {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn {
            padding: 13px 18px;
            border-radius: 999px;
            transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--wine), var(--burnt));
            color: #fff8ef;
            box-shadow: 0 16px 36px rgba(111, 29, 27, 0.22);
        }

        .btn-secondary {
            background: rgba(255, 252, 247, 0.9);
            color: var(--wine);
            border: 1px solid var(--line);
        }

        .hero-side {
            display: grid;
            gap: 12px;
        }

        .mission-card,
        .legend-card {
            padding: 18px;
            border-radius: var(--radius-lg);
            background: rgba(255, 251, 245, 0.82);
            border: 1px solid rgba(111, 29, 27, 0.08);
        }

        .mission-card h2 {
            font-family: "Bebas Neue", sans-serif;
            font-size: 2rem;
            letter-spacing: 0.06em;
            line-height: 0.92;
        }

        .mission-card p,
        .legend-card p {
            margin-top: 10px;
            color: var(--muted);
            line-height: 1.55;
            font-size: 0.95rem;
        }

        .legend-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 12px;
        }

        .legend-chip,
        .tag {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 9px 12px;
            border-radius: 999px;
            background: rgba(255, 247, 235, 0.92);
            border: 1px solid rgba(111, 29, 27, 0.08);
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 700;
        }

        .legend-chip::before {
            content: "";
            width: 10px;
            height: 10px;
            margin-right: 8px;
            border-radius: 50%;
            background: var(--dot);
        }

        .workflow {
            margin-top: 20px;
            padding: 24px;
        }

        .workflow-head {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }

        .workflow-head h2 {
            font-family: "Bebas Neue", sans-serif;
            font-size: clamp(2.4rem, 5vw, 4.4rem);
            line-height: 0.92;
            letter-spacing: 0.05em;
        }

        .workflow-head p {
            color: var(--muted);
            max-width: 32ch;
            line-height: 1.5;
            font-size: 0.96rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 18px;
        }

        .control {
            padding: 11px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: rgba(255, 251, 245, 0.86);
            color: var(--ink);
            transition: all var(--transition);
        }

        .control.active {
            background: linear-gradient(135deg, var(--wine), var(--burnt));
            color: #fff8ef;
            box-shadow: 0 14px 28px rgba(111, 29, 27, 0.18);
        }

        .stage-shell {
            position: relative;
            min-height: 470px;
            overflow: hidden;
            border-radius: 30px;
            background:
                radial-gradient(circle at 50% 0%, rgba(239, 177, 80, 0.12), transparent 35%),
                linear-gradient(180deg, rgba(255, 252, 247, 0.9), rgba(251, 243, 232, 0.76));
            border: 1px solid rgba(111, 29, 27, 0.08);
        }

        .stage-shell::before {
            content: "";
            position: absolute;
            left: 8%;
            right: 8%;
            top: 50%;
            height: 4px;
            transform: translateY(-50%);
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(111, 29, 27, 0.08), rgba(199, 90, 49, 0.28), rgba(70, 121, 95, 0.2));
        }

        .arrow-band {
            position: absolute;
            inset: 50% 10% auto 10%;
            height: 0;
            transform: translateY(-50%);
            pointer-events: none;
        }

        .arrow {
            position: absolute;
            top: -16px;
            width: 90px;
            height: 32px;
            opacity: 0.14;
            transition: opacity var(--transition), transform var(--transition);
        }

        .arrow::before {
            content: "";
            position: absolute;
            left: 0;
            right: 16px;
            top: 14px;
            height: 4px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(199, 90, 49, 0.8), rgba(239, 177, 80, 0.92));
        }

        .arrow::after {
            content: "";
            position: absolute;
            right: 0;
            top: 8px;
            width: 14px;
            height: 14px;
            border-top: 4px solid rgba(239, 177, 80, 0.96);
            border-right: 4px solid rgba(239, 177, 80, 0.96);
            transform: rotate(45deg);
        }

        .arrow.active {
            opacity: 1;
            animation: arrowPulse 1.2s ease-in-out infinite;
        }

        .stage-track {
            position: relative;
            height: 100%;
        }

        .stage-card {
            position: absolute;
            top: 50%;
            left: 50%;
            width: min(340px, calc(100% - 32px));
            padding: 22px;
            border-radius: 28px;
            background: var(--card);
            border: 1px solid rgba(111, 29, 27, 0.08);
            box-shadow: 0 22px 50px rgba(88, 45, 24, 0.1);
            transform-origin: center;
            transition: transform var(--transition), opacity var(--transition), filter var(--transition), box-shadow var(--transition);
            cursor: pointer;
        }

        .stage-card.active {
            box-shadow: 0 32px 70px rgba(88, 45, 24, 0.15);
        }

        .stage-card[data-pos="-2"] {
            transform: translate(-154%, -50%) scale(0.78);
            opacity: 0;
            filter: blur(2px);
            pointer-events: none;
        }

        .stage-card[data-pos="-1"] {
            transform: translate(-112%, -50%) scale(0.9);
            opacity: 0.46;
        }

        .stage-card[data-pos="0"] {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            z-index: 4;
        }

        .stage-card[data-pos="1"] {
            transform: translate(12%, -50%) scale(0.9);
            opacity: 0.46;
        }

        .stage-card[data-pos="2"] {
            transform: translate(54%, -50%) scale(0.78);
            opacity: 0;
            filter: blur(2px);
            pointer-events: none;
        }

        .stage-top {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .stage-number {
            color: var(--wine);
            font-size: 1.1rem;
        }

        .role-pill {
            padding: 8px 12px;
            border-radius: 999px;
            color: #fff8ef;
            font-size: 0.88rem;
        }

        .stage-card h3 {
            margin-top: 18px;
            font-size: 1.55rem;
            line-height: 1.08;
        }

        .stage-card p {
            margin-top: 12px;
            color: var(--muted);
            line-height: 1.5;
            font-size: 0.96rem;
        }

        .stage-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .stage-footer {
            margin-top: 16px;
            padding-top: 14px;
            border-top: 1px dashed rgba(111, 29, 27, 0.12);
        }

        .mini-label {
            color: var(--burnt);
            font-size: 0.88rem;
        }

        .mini-copy {
            display: block;
            margin-top: 6px;
            font-size: 0.92rem;
            color: var(--ink);
            font-weight: 700;
        }

        .stage-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 18px;
        }

        .nav-group,
        .dots {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(255, 251, 245, 0.92);
            border: 1px solid var(--line);
            color: var(--wine);
            font-size: 1.3rem;
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(111, 29, 27, 0.18);
            transition: transform var(--transition), background var(--transition);
        }

        .dot.active {
            background: linear-gradient(135deg, var(--burnt), var(--gold));
            transform: scale(1.35);
        }

        .strip {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }

        .strip-card {
            padding: 16px;
            border-radius: 22px;
            background: rgba(255, 251, 245, 0.82);
            border: 1px solid rgba(111, 29, 27, 0.08);
        }

        .strip-card strong {
            display: block;
            font-family: "Bebas Neue", sans-serif;
            font-size: 1.5rem;
            letter-spacing: 0.08em;
            color: var(--wine);
        }

        .strip-card span {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.45;
        }

        .reveal {
            opacity: 0;
            transform: translateY(16px);
            transition: opacity 700ms ease, transform 700ms ease;
        }

        .reveal.in-view {
            opacity: 1;
            transform: translateY(0);
        }

        .seeker { background: linear-gradient(135deg, var(--seeker), #e19151); }
        .admin { background: linear-gradient(135deg, var(--admin), #9f4237); }
        .management { background: linear-gradient(135deg, var(--management), #5a98b0); }
        .group { background: linear-gradient(135deg, var(--group), #68a47f); }

        @keyframes arrowPulse {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(8px); }
        }

        @media (max-width: 1000px) {
            .hero-grid {
                grid-template-columns: 1fr;
            }

            .strip {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 760px) {
            .page {
                width: min(calc(100% - 14px), 1240px);
                padding-top: 10px;
            }

            .hero,
            .workflow {
                padding: 18px 16px;
            }

            .workflow-head {
                flex-direction: column;
                align-items: start;
            }

            .hero-actions,
            .controls {
                width: 100%;
            }

            .btn,
            .control {
                width: 100%;
                text-align: center;
            }

            .stage-shell {
                min-height: 440px;
            }

            .stage-card {
                width: calc(100% - 26px);
            }

            .stage-card[data-pos="-1"],
            .stage-card[data-pos="1"] {
                opacity: 0.14;
            }

            .strip {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <section class="panel hero reveal">
            <div class="hero-grid">
                <div>
                    <div class="eyebrow">Animated workflow</div>
                    <h1>From Click To Community</h1>
                    <p id="heroText"></p>
                    <div class="hero-actions">
                        <button id="playBtn" class="btn btn-primary" type="button">Start Motion</button>
                        <button id="nextBtn" class="btn btn-secondary" type="button">Next Stage</button>
                    </div>
                </div>

                <div class="hero-side">
                    <article class="mission-card">
                        <h2>ONE GOAL</h2>
                        <p>Get the seeker into the right group fast, share the gospel within 24 hours, then move into weekly discipleship.</p>
                    </article>
                    <article class="legend-card">
                        <div class="mini-label">Roles</div>
                        <div class="legend-row" id="legend"></div>
                    </article>
                </div>
            </div>
        </section>

        <section class="panel workflow reveal">
            <div class="workflow-head">
                <div>
                    <div class="mini-label">Stage flow</div>
                    <h2>Simple Visual Workflow</h2>
                </div>
                <p>Cards slide. Arrows pulse. Click a stage to focus it.</p>
            </div>

            <div class="controls" id="filters"></div>

            <div class="stage-shell">
                <div class="arrow-band" id="arrows"></div>
                <div class="stage-track" id="stageTrack"></div>
            </div>

            <div class="stage-nav">
                <div class="nav-group">
                    <button class="nav-btn" id="prevBtn" type="button" aria-label="Previous stage">&#8592;</button>
                    <button class="nav-btn" id="forwardBtn" type="button" aria-label="Next stage">&#8594;</button>
                </div>
                <div class="dots" id="dots"></div>
            </div>

            <div class="strip" id="strip"></div>
        </section>
    </main>

    <script>
        const data = {
            hero: "A clean one-page presentation of the seeker journey.",
            roles: {
                seeker: { label: "Seeker", className: "seeker", color: "var(--seeker)" },
                admin: { label: "Admin", className: "admin", color: "var(--admin)" },
                management: { label: "Management", className: "management", color: "var(--management)" },
                group: { label: "Group Leader / Members", className: "group", color: "var(--group)" }
            },
            stages: [
                {
                    number: "01",
                    role: "seeker",
                    title: "YouTube vlog",
                    text: "Seeker sees the invitation.",
                    tags: ["Video", "Link"],
                    note: "Start"
                },
                {
                    number: "02",
                    role: "seeker",
                    title: "Click link",
                    text: "Seeker opens Facebook Messenger.",
                    tags: ["Messenger", "Direct"],
                    note: "Immediate"
                },
                {
                    number: "03",
                    role: "admin",
                    title: "Admin chat",
                    text: "Admin welcomes and asks for details.",
                    tags: ["Name", "Schedule"],
                    note: "Intake"
                },
                {
                    number: "04",
                    role: "management",
                    title: "Record details",
                    text: "Management logs the seeker.",
                    tags: ["Record", "Tracking"],
                    note: "Handoff"
                },
                {
                    number: "05",
                    role: "admin",
                    title: "Place in GC",
                    text: "Admin adds seeker to the matched group chat.",
                    tags: ["Group Chat", "Preferred Time"],
                    note: "Routing"
                },
                {
                    number: "06",
                    role: "group",
                    title: "Share gospel",
                    text: "Leader or member shares within 24 hours.",
                    tags: ["24 Hours", "Care"],
                    note: "Priority"
                },
                {
                    number: "07",
                    role: "group",
                    title: "Install app",
                    text: "Team guides the seeker into Go Mission.",
                    tags: ["App", "Next Step"],
                    note: "Onboarding"
                },
                {
                    number: "08",
                    role: "seeker",
                    title: "Join weekly meeting",
                    text: "Seeker enters weekly discipleship.",
                    tags: ["Weekly", "Community"],
                    note: "Ongoing"
                }
            ],
            strip: [
                { title: "24 Hours", text: "Gospel sharing target" },
                { title: "Right GC", text: "Match day and time" },
                { title: "Simple Intake", text: "Only needed details" },
                { title: "Weekly Rhythm", text: "Move into group life" }
            ]
        };

        const heroText = document.getElementById("heroText");
        const legend = document.getElementById("legend");
        const filters = document.getElementById("filters");
        const stageTrack = document.getElementById("stageTrack");
        const arrows = document.getElementById("arrows");
        const dots = document.getElementById("dots");
        const strip = document.getElementById("strip");
        const playBtn = document.getElementById("playBtn");
        const nextBtn = document.getElementById("nextBtn");
        const prevBtn = document.getElementById("prevBtn");
        const forwardBtn = document.getElementById("forwardBtn");

        heroText.textContent = data.hero;

        let activeFilter = "all";
        let activeIndex = 0;
        let autoplay = null;

        function visibleStages() {
            return data.stages.filter((stage) => activeFilter === "all" || stage.role === activeFilter);
        }

        function roleMarkup(role) {
            return `<span class="legend-chip" style="--dot:${role.color}">${role.label}</span>`;
        }

        function filterMarkup(key, label) {
            const active = activeFilter === key ? "active" : "";
            return `<button class="control ${active}" type="button" data-filter="${key}">${label}</button>`;
        }

        function stageMarkup(stage, position, absoluteIndex) {
            const role = data.roles[stage.role];
            return `
                <article class="stage-card ${position === 0 ? "active" : ""}" data-pos="${position}" data-index="${absoluteIndex}">
                    <div class="stage-top">
                        <span class="stage-number">${stage.number}</span>
                        <span class="role-pill ${role.className}">${role.label}</span>
                    </div>
                    <h3>${stage.title}</h3>
                    <p>${stage.text}</p>
                    <div class="stage-tags">
                        ${stage.tags.map((tag) => `<span class="tag">${tag}</span>`).join("")}
                    </div>
                    <div class="stage-footer">
                        <span class="mini-label">Focus</span>
                        <span class="mini-copy">${stage.note}</span>
                    </div>
                </article>
            `;
        }

        function renderLegend() {
            legend.innerHTML = Object.values(data.roles).map(roleMarkup).join("");
        }

        function renderFilters() {
            filters.innerHTML = [
                filterMarkup("all", "All"),
                ...Object.entries(data.roles).map(([key, role]) => filterMarkup(key, role.label))
            ].join("");
        }

        function renderArrows(count) {
            if (count <= 1) {
                arrows.innerHTML = "";
                return;
            }

            arrows.innerHTML = Array.from({ length: count - 1 }, (_, index) => {
                const left = `${(index + 0.5) * (100 / count)}%`;
                const active = index === activeIndex ? "active" : "";
                return `<div class="arrow ${active}" style="left:${left}"></div>`;
            }).join("");
        }

        function renderDots(stages) {
            dots.innerHTML = stages.map((_, index) => `<span class="dot ${index === activeIndex ? "active" : ""}"></span>`).join("");
        }

        function renderStages() {
            const stages = visibleStages();
            if (!stages.length) return;

            if (activeIndex >= stages.length) {
                activeIndex = 0;
            }

            stageTrack.innerHTML = stages
                .map((stage, index) => {
                    const delta = index - activeIndex;
                    const pos = Math.max(-2, Math.min(2, delta));
                    return stageMarkup(stage, pos, index);
                })
                .join("");

            stageTrack.querySelectorAll(".stage-card").forEach((card) => {
                card.addEventListener("click", () => {
                    activeIndex = Number(card.dataset.index);
                    renderStages();
                });
            });

            renderArrows(stages.length);
            renderDots(stages);
        }

        function renderStrip() {
            strip.innerHTML = data.strip.map((item) => `
                <article class="strip-card">
                    <strong>${item.title}</strong>
                    <span>${item.text}</span>
                </article>
            `).join("");
        }

        function nextStage() {
            const stages = visibleStages();
            activeIndex = (activeIndex + 1) % stages.length;
            renderStages();
        }

        function prevStage() {
            const stages = visibleStages();
            activeIndex = (activeIndex - 1 + stages.length) % stages.length;
            renderStages();
        }

        function toggleAutoplay() {
            if (autoplay) {
                clearInterval(autoplay);
                autoplay = null;
                playBtn.textContent = "Start Motion";
                return;
            }

            playBtn.textContent = "Stop Motion";
            autoplay = setInterval(nextStage, 2200);
        }

        filters.addEventListener("click", (event) => {
            const button = event.target.closest("[data-filter]");
            if (!button) return;
            activeFilter = button.dataset.filter;
            activeIndex = 0;
            renderFilters();
            renderStages();
        });

        playBtn.addEventListener("click", toggleAutoplay);
        nextBtn.addEventListener("click", nextStage);
        prevBtn.addEventListener("click", prevStage);
        forwardBtn.addEventListener("click", nextStage);

        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("in-view");
                }
            });
        }, { threshold: 0.18 });

        document.querySelectorAll(".reveal").forEach((element) => observer.observe(element));

        renderLegend();
        renderFilters();
        renderStages();
        renderStrip();
    </script>
</body>
</html>
