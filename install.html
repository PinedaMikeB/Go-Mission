<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Go Mission App</title>
    <meta name="theme-color" content="#f59e0b">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0505 0%, #2a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #f59e0b;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .install-btn {
            display: block;
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #1a0505;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }
        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.4);
        }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔥</div>
        <h1>GO MISSION</h1>
        <p>Making Disciple-Makers</p>
        <button class="install-btn" onclick="openInBrowser()">
            📱 Install Go Mission App
        </button>
        <p class="note" id="note"></p>
    </div>

    <script>
        const appUrl = 'https://gomission.netlify.app/?install=true';
        
        function openInBrowser() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            
            // Detect in-app browsers (Messenger, Facebook, Instagram, etc.)
            const isInAppBrowser = /FBAN|FBAV|Instagram|Messenger|Line|Twitter|MicroMessenger|WeChat/i.test(ua);
            const isIOS = /iPhone|iPad|iPod/i.test(ua);
            const isAndroid = /Android/i.test(ua);
            
            if (isInAppBrowser) {
                if (isIOS) {
                    // iOS: Try to open in Safari using a workaround
                    // Method 1: Use window.open with _system
                    window.open(appUrl, '_system');
                    
                    // Method 2: Show manual instruction after delay
                    setTimeout(() => {
                        document.getElementById('note').innerHTML = 
                            '👆 If the app didn\'t open in Safari:<br><br>' +
                            '1. Tap the <b>⋯</b> button at the bottom right<br>' +
                            '2. Select <b>"Open in Safari"</b> or <b>"Open in Browser"</b>';
                    }, 1000);
                } else if (isAndroid) {
                    // Android: Use intent to open in Chrome
                    const intentUrl = 'intent://' + appUrl.replace('https://', '') + 
                        '#Intent;scheme=https;package=com.android.chrome;end';
                    window.location.href = intentUrl;
                    
                    // Fallback: try regular open
                    setTimeout(() => {
                        window.open(appUrl, '_blank');
                    }, 500);
                    
                    // Show manual instruction
                    setTimeout(() => {
                        document.getElementById('note').innerHTML = 
                            '👆 If the app didn\'t open in Chrome:<br><br>' +
                            '1. Tap the <b>⋮</b> menu at top right<br>' +
                            '2. Select <b>"Open in Chrome"</b> or <b>"Open in Browser"</b>';
                    }, 1000);
                }
            } else {
                // Already in a real browser, just navigate
                window.location.href = appUrl;
            }
        }
        
        // Auto-detect and show appropriate message
        (function() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isInAppBrowser = /FBAN|FBAV|Instagram|Messenger|Line|Twitter|MicroMessenger|WeChat/i.test(ua);
            
            if (isInAppBrowser) {
                document.getElementById('note').textContent = 'Tap the button to open in your browser';
            }
        })();
    </script>
</body>
</html>
