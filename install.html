<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Go Mission App</title>
    <meta name="theme-color" content="#f59e0b">
    <link rel="icon" href="/favicon.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0505 0%, #2a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #f59e0b;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        p {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .install-btn {
            display: block;
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #1a0505;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
        }
        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px rgba(245, 158, 11, 0.4);
        }
        .install-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔥</div>
        <h1>GO MISSION</h1>
        <p>Making Disciple-Makers</p>
        <a href="/?install=true" class="install-btn">
            📱 Install Go Mission App
        </a>
    </div>
</body>
</html>
