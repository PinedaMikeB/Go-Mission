<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Install Go Mission App</title>
    <meta name="theme-color" content="#f59e0b">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0505 0%, #2a0505 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            text-align: center;
            max-width: 400px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            color: #f59e0b;
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
        }
        .device-badge {
            display: inline-block;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #86efac;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .install-btn {
            display: block;
            width: 100%;
            padding: 20px 40px;
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #1a0505;
            font-size: 20px;
            font-weight: 800;
            text-decoration: none;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(245, 158, 11, 0.3);
            margin-bottom: 20px;
        }
        .install-btn:active {
            transform: scale(0.98);
        }
        .manual-steps {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px;
            text-align: left;
        }
        .manual-steps.hidden {
            display: none;
        }
        .manual-steps h3 {
            color: #f59e0b;
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }
        .manual-step {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
            align-items: flex-start;
        }
        .step-num {
            width: 28px;
            height: 28px;
            background: #f59e0b;
            color: #1a0505;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
            flex-shrink: 0;
        }
        .step-text {
            color: #e2e8f0;
            font-size: 15px;
            line-height: 1.5;
        }
        .step-text strong {
            color: #fcd34d;
        }
        .highlight-icon {
            display: inline-block;
            background: rgba(251, 191, 36, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 18px;
            margin-left: 4px;
        }
        .url-box {
            background: rgba(0,0,0,0.4);
            border: 1px solid rgba(251, 191, 36, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-top: 16px;
            text-align: center;
        }
        .url-box p {
            color: #94a3b8;
            font-size: 12px;
            margin-bottom: 8px;
        }
        .url-box code {
            color: #fcd34d;
            font-size: 16px;
            font-weight: 600;
        }
        .copy-btn {
            background: #f59e0b;
            color: #1a0505;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
        }
        .copy-btn.copied {
            background: #22c55e;
        }
        .status-text {
            color: #64748b;
            font-size: 12px;
            margin-top: 20px;
        }
        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f59e0b;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔥</div>
        <h1>GO MISSION</h1>
        <p class="subtitle" id="subtitle">Making Disciple-Makers</p>
        
        <div class="device-badge" id="deviceBadge">Detecting device...</div>
        
        <button class="install-btn" id="installBtn" onclick="handleInstall()">
            📱 Install Go Mission App
        </button>
        
        <!-- Fallback instructions if auto-open fails -->
        <div class="manual-steps hidden" id="manualSteps">
            <h3 id="manualTitle">📲 Open Manually</h3>
            
            <div id="iosSteps" class="hidden">
                <div class="manual-step">
                    <div class="step-num">1</div>
                    <div class="step-text">
                        Tap <strong>•••</strong> at the bottom <span class="highlight-icon">•••</span>
                    </div>
                </div>
                <div class="manual-step">
                    <div class="step-num">2</div>
                    <div class="step-text">
                        Select <strong>"Open in Safari"</strong>
                    </div>
                </div>
            </div>
            
            <div id="androidSteps" class="hidden">
                <div class="manual-step">
                    <div class="step-num">1</div>
                    <div class="step-text">
                        Tap <strong>⋮</strong> menu at top right <span class="highlight-icon">⋮</span>
                    </div>
                </div>
                <div class="manual-step">
                    <div class="step-num">2</div>
                    <div class="step-text">
                        Select <strong>"Open in Chrome"</strong>
                    </div>
                </div>
            </div>
            
            <div id="desktopSteps" class="hidden">
                <div class="manual-step">
                    <div class="step-num">1</div>
                    <div class="step-text">
                        Copy the link below
                    </div>
                </div>
                <div class="manual-step">
                    <div class="step-num">2</div>
                    <div class="step-text">
                        Open <strong>Chrome</strong> and paste it
                    </div>
                </div>
            </div>
            
            <div class="url-box">
                <p>Copy this link:</p>
                <code>gomission.netlify.app</code>
                <br>
                <button class="copy-btn" id="copyBtn" onclick="copyUrl()">📋 Copy Link</button>
            </div>
        </div>
        
        <p class="status-text" id="statusText"></p>
    </div>

    <script>
        const appUrl = 'https://gomission.netlify.app/?install=true';
        
        // ============================================
        // DEVICE DETECTION
        // ============================================
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        
        // Device type
        const isIOS = /iPhone|iPad|iPod/i.test(ua);
        const isAndroid = /Android/i.test(ua);
        const isDesktop = !isIOS && !isAndroid;
        
        // In-app browser detection (Messenger, Facebook, Instagram, etc.)
        const inAppPatterns = [
            'FBAN', 'FBAV', 'FB_IAB', 'FBIOS', 'FBSS',
            'Instagram', 'Messenger', 'Line', 
            'MicroMessenger', 'WeChat', 'Twitter',
            'Snapchat', 'Pinterest', 'LinkedInApp'
        ];
        const isInAppBrowser = inAppPatterns.some(p => ua.includes(p));
        
        // Detect which in-app browser
        function getInAppName() {
            if (ua.includes('Messenger') || (ua.includes('FBAN') && ua.includes('Messenger'))) return 'Messenger';
            if (ua.includes('FBAN') || ua.includes('FBAV')) return 'Facebook';
            if (ua.includes('Instagram')) return 'Instagram';
            if (ua.includes('Line')) return 'Line';
            if (ua.includes('MicroMessenger')) return 'WeChat';
            return 'app';
        }
        
        // ============================================
        // INITIALIZE PAGE
        // ============================================
        function initPage() {
            const badge = document.getElementById('deviceBadge');
            const btn = document.getElementById('installBtn');
            const subtitle = document.getElementById('subtitle');
            
            if (isIOS) {
                badge.textContent = '📱 iPhone detected';
                btn.innerHTML = '🍎 Open in Safari';
            } else if (isAndroid) {
                badge.textContent = '📱 Android detected';
                btn.innerHTML = '🌐 Open in Chrome';
            } else {
                badge.textContent = '💻 Desktop detected';
                btn.innerHTML = '🌐 Open in Chrome';
            }
            
            // If in Messenger/Facebook app
            if (isInAppBrowser) {
                const appName = getInAppName();
                subtitle.textContent = `You're in ${appName}. Tap below to open in browser.`;
                badge.style.background = 'rgba(251, 191, 36, 0.2)';
                badge.style.borderColor = 'rgba(251, 191, 36, 0.4)';
                badge.style.color = '#fcd34d';
                badge.textContent = `⚠️ ${appName} browser detected`;
            }
        }
        
        // ============================================
        // HANDLE INSTALL BUTTON
        // ============================================
        function handleInstall() {
            const statusText = document.getElementById('statusText');
            statusText.innerHTML = '<span class="loading"></span> Opening browser...';
            
            if (isIOS) {
                openInSafari();
            } else if (isAndroid) {
                openInChrome();
            } else {
                openInDesktopChrome();
            }
            
            // Show manual fallback after 2 seconds if still on page
            setTimeout(() => {
                showManualSteps();
            }, 2000);
        }
        
        // ============================================
        // iOS - OPEN IN SAFARI
        // ============================================
        function openInSafari() {
            // Method 1: Direct navigation (works if already in Safari or can escape)
            // The x-safari-https:// scheme doesn't work reliably
            
            // Method 2: Try to trigger Safari via window.open
            const newWindow = window.open(appUrl, '_blank');
            
            // Method 3: If in Messenger, try the direct URL 
            // Messenger sometimes opens links in Safari when using location.href
            setTimeout(() => {
                window.location.href = appUrl;
            }, 100);
            
            // Show iOS-specific manual steps
            document.getElementById('iosSteps').classList.remove('hidden');
        }
        
        // ============================================
        // ANDROID - OPEN IN CHROME
        // ============================================
        function openInChrome() {
            // Method 1: Android Intent URL (best for Messenger/Facebook)
            const intentUrl = 'intent://gomission.netlify.app/?install=true#Intent;' +
                'scheme=https;' +
                'package=com.android.chrome;' +
                'S.browser_fallback_url=' + encodeURIComponent(appUrl) + ';' +
                'end';
            
            window.location.href = intentUrl;
            
            // Method 2: Fallback - try googlechrome:// scheme
            setTimeout(() => {
                window.location.href = 'googlechrome://navigate?url=' + encodeURIComponent(appUrl);
            }, 500);
            
            // Method 3: Last resort - direct URL
            setTimeout(() => {
                window.location.href = appUrl;
            }, 1000);
            
            // Show Android-specific manual steps
            document.getElementById('androidSteps').classList.remove('hidden');
        }
        
        // ============================================
        // DESKTOP - OPEN IN CHROME
        // ============================================
        function openInDesktopChrome() {
            // Desktop: Just open in new tab (will use default browser)
            window.open(appUrl, '_blank');
            
            // Also try direct navigation
            setTimeout(() => {
                window.location.href = appUrl;
            }, 500);
            
            // Show desktop-specific manual steps
            document.getElementById('desktopSteps').classList.remove('hidden');
        }
        
        // ============================================
        // SHOW MANUAL FALLBACK STEPS
        // ============================================
        function showManualSteps() {
            const manualSteps = document.getElementById('manualSteps');
            const statusText = document.getElementById('statusText');
            const manualTitle = document.getElementById('manualTitle');
            
            manualSteps.classList.remove('hidden');
            statusText.textContent = "Didn't open? Follow the steps below:";
            
            if (isIOS) {
                manualTitle.textContent = '📲 Open in Safari Manually';
                document.getElementById('iosSteps').classList.remove('hidden');
            } else if (isAndroid) {
                manualTitle.textContent = '📲 Open in Chrome Manually';
                document.getElementById('androidSteps').classList.remove('hidden');
            } else {
                manualTitle.textContent = '📲 Open in Chrome Manually';
                document.getElementById('desktopSteps').classList.remove('hidden');
            }
        }
        
        // ============================================
        // COPY URL
        // ============================================
        function copyUrl() {
            const url = 'gomission.netlify.app';
            const copyBtn = document.getElementById('copyBtn');
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(() => {
                    showCopied(copyBtn);
                }).catch(() => {
                    fallbackCopy(url, copyBtn);
                });
            } else {
                fallbackCopy(url, copyBtn);
            }
        }
        
        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.cssText = 'position:fixed;opacity:0;left:-9999px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch (e) {
                alert('Copy this link: ' + text);
            }
            
            document.body.removeChild(textarea);
        }
        
        function showCopied(btn) {
            btn.textContent = '✅ Copied!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 Copy Link';
                btn.classList.remove('copied');
            }, 2000);
        }
        
        // Initialize
        initPage();
    </script>
</body>
</html>
