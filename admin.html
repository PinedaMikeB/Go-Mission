<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Mission - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #1a0a0a; color: #f5f5f4; font-family: 'Inter', sans-serif; }
        .card { background: rgba(45, 15, 15, 0.85); border: 1px solid rgba(120, 113, 108, 0.15); }
        input, select { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-amber-500 mb-6">🔧 Go Mission Admin Panel</h1>
        
        <!-- Auth Status -->
        <div id="authStatus" class="card rounded-xl p-4 mb-6">
            <p class="text-slate-400">Checking authentication...</p>
        </div>
        
        <!-- Force Update Section -->
        <div class="card rounded-xl p-6 mb-6">
            <h2 class="text-lg font-bold text-white mb-4">🔄 Force Update All Users</h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Update Type</label>
                    <select id="updateType" class="w-full rounded-lg p-3 text-white">
                        <option value="immediate">Immediate (Update Now)</option>
                        <option value="scheduled">Scheduled (Pick Time)</option>
                    </select>
                </div>
                
                <div id="scheduleOptions" class="hidden">
                    <label class="block text-sm text-slate-400 mb-2">Schedule For</label>
                    <input type="datetime-local" id="scheduleTime" class="w-full rounded-lg p-3 text-white">
                    <p class="text-xs text-slate-500 mt-1">Users will be updated at this time</p>
                </div>
                
                <div>
                    <label class="block text-sm text-slate-400 mb-2">Update Details (shown to users)</label>
                    <textarea id="updateDetails" class="w-full rounded-lg p-3 text-white h-24" 
                              placeholder="e.g., Bug fixes and performance improvements"></textarea>
                </div>
                
                <button onclick="triggerForceUpdate()" 
                        class="w-full py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold transition-colors">
                    ⚠️ Force Update All Users
                </button>
            </div>
        </div>
        
        <!-- Current Force Update Status -->
        <div class="card rounded-xl p-6 mb-6">
            <h2 class="text-lg font-bold text-white mb-4">📊 Current Force Update Status</h2>
            <div id="forceUpdateStatus">
                <p class="text-slate-400">Loading...</p>
            </div>
        </div>
        
        <!-- Stats -->
        <div class="card rounded-xl p-6">
            <h2 class="text-lg font-bold text-white mb-4">📈 App Stats</h2>
            <div id="appStats">
                <p class="text-slate-400">Loading...</p>
            </div>
        </div>
    </div>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBarR1ENd5qBWHZBGhKdxa-Zrw3Y8XpoT4",
            authDomain: "shaped-by-grace.firebaseapp.com",
            projectId: "shaped-by-grace",
            storageBucket: "shaped-by-grace.firebasestorage.app",
            messagingSenderId: "421948043828",
            appId: "1:421948043828:web:4a8eb4ac2aa34df4c89061"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Admin UIDs (add your UID here)
        const ADMIN_UIDS = [
            '9zVKHJ11zaXD0f4GI6P7LHD6re32' // Mike Pineda
        ];
        
        window.db = db;
        window.doc = doc;
        window.getDoc = getDoc;
        window.setDoc = setDoc;
        
        // Toggle schedule options
        document.getElementById('updateType').addEventListener('change', (e) => {
            document.getElementById('scheduleOptions').classList.toggle('hidden', e.target.value !== 'scheduled');
        });
        
        // Check auth
        onAuthStateChanged(auth, async (user) => {
            const authStatus = document.getElementById('authStatus');
            
            if (!user) {
                authStatus.innerHTML = `
                    <p class="text-red-400">❌ Not signed in</p>
                    <p class="text-sm text-slate-400 mt-2">Please sign in at <a href="/" class="text-amber-500">gomission.netlify.app</a> first</p>
                `;
                return;
            }
            
            if (!ADMIN_UIDS.includes(user.uid)) {
                authStatus.innerHTML = `
                    <p class="text-red-400">❌ Access Denied</p>
                    <p class="text-sm text-slate-400 mt-2">You are not an admin. Your UID: ${user.uid}</p>
                `;
                return;
            }
            
            authStatus.innerHTML = `
                <p class="text-green-400">✅ Signed in as Admin</p>
                <p class="text-sm text-slate-400">${user.email}</p>
            `;
            
            // Load force update status
            loadForceUpdateStatus();
            loadAppStats();
        });
        
        // Load current force update status
        async function loadForceUpdateStatus() {
            try {
                const configRef = doc(db, 'goMission_config', 'forceUpdate');
                const configDoc = await getDoc(configRef);
                
                const statusEl = document.getElementById('forceUpdateStatus');
                
                if (configDoc.exists()) {
                    const data = configDoc.data();
                    statusEl.innerHTML = `
                        <div class="space-y-2 text-sm">
                            <p><span class="text-slate-400">Status:</span> <span class="${data.enabled ? 'text-green-400' : 'text-slate-500'}">${data.enabled ? 'Active' : 'Inactive'}</span></p>
                            <p><span class="text-slate-400">Last Triggered:</span> ${data.timestamp ? new Date(data.timestamp).toLocaleString() : 'Never'}</p>
                            ${data.scheduledFor ? `<p><span class="text-slate-400">Scheduled For:</span> ${new Date(data.scheduledFor).toLocaleString()}</p>` : ''}
                            <p><span class="text-slate-400">Details:</span> ${data.details || 'None'}</p>
                            
                            <button onclick="disableForceUpdate()" class="mt-3 px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm">
                                Disable Force Update
                            </button>
                        </div>
                    `;
                } else {
                    statusEl.innerHTML = '<p class="text-slate-500">No force update configured</p>';
                }
            } catch (error) {
                console.error('Error loading status:', error);
            }
        }
        window.loadForceUpdateStatus = loadForceUpdateStatus;
        
        // Load app stats
        async function loadAppStats() {
            try {
                // Get gospel stats
                const gospelRef = doc(db, 'stats', 'gospel');
                const gospelDoc = await getDoc(gospelRef);
                
                // Get user count (approximate)
                const membersRef = collection(db, 'goMission_members');
                const membersSnap = await getDocs(membersRef);
                
                const statsEl = document.getElementById('appStats');
                const gospelData = gospelDoc.exists() ? gospelDoc.data() : {};
                
                statsEl.innerHTML = `
                    <div class="grid grid-cols-2 gap-4 text-sm">
                        <div class="card rounded-lg p-3">
                            <p class="text-2xl font-bold text-amber-500">${membersSnap.size}</p>
                            <p class="text-slate-400">Total Users</p>
                        </div>
                        <div class="card rounded-lg p-3">
                            <p class="text-2xl font-bold text-green-400">${gospelData.savedCount || 0}</p>
                            <p class="text-slate-400">Salvations</p>
                        </div>
                    </div>
                `;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }
        
        // Trigger force update
        window.triggerForceUpdate = async function() {
            const updateType = document.getElementById('updateType').value;
            const details = document.getElementById('updateDetails').value;
            const scheduleTime = document.getElementById('scheduleTime').value;
            
            if (!confirm('⚠️ This will force ALL users to update their app. Continue?')) {
                return;
            }
            
            try {
                const configRef = doc(db, 'goMission_config', 'forceUpdate');
                
                const updateData = {
                    enabled: true,
                    timestamp: new Date().toISOString(),
                    details: details || 'App update available',
                    triggeredBy: auth.currentUser.email
                };
                
                if (updateType === 'scheduled' && scheduleTime) {
                    updateData.scheduledFor = new Date(scheduleTime).toISOString();
                }
                
                await setDoc(configRef, updateData);
                
                alert('✅ Force update triggered successfully!');
                loadForceUpdateStatus();
                
            } catch (error) {
                console.error('Error:', error);
                alert('❌ Error: ' + error.message);
            }
        };
        
        // Disable force update
        window.disableForceUpdate = async function() {
            try {
                const configRef = doc(db, 'goMission_config', 'forceUpdate');
                await setDoc(configRef, { enabled: false }, { merge: true });
                alert('✅ Force update disabled');
                loadForceUpdateStatus();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        };
    </script>
</body>
</html>
